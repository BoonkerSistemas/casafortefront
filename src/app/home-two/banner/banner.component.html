<div class="home-slides" id="banner">
    <owl-carousel-o [options]="homeSlides">
        <ng-template carouselSlide *ngFor="let slider of sliders">
            <div class="main-banner">
                <ng-container *ngIf="isVideo(slider.image.url); else imageContent">
                    <!-- Video como fondo -->
                    <video autoplay loop [muted]="true" playsinline class="video-background">
                        <source [src]="slider.videoUrl" type="video/mp4">
                    </video>
                </ng-container>
                <ng-template #imageContent>
                    <!-- Imagen como fondo -->
                    <div [style.background-image]="'url(' + environment.api_img + slider.image.url + ')'"
                        class="video-background"></div>
                </ng-template>

                <div class="d-table">
                    <div class="d-table-cell">
                        <div class="container-text">
                            <div class="main-banner-text">
                                <!-- Primera fila de imágenes - Solo visible en desktop/tablet -->
                                <div class="container row d-none d-md-flex" style="margin-left: 4%;">
                                    <div class="col-md-3" style="padding-left: 0;">
                                        <img [src]="environment.api_img + slider.banner[0].url" alt="">
                                    </div>
                                    <div class="col-md-3" style="padding-left: 0;">
                                        <img [src]="environment.api_img + slider.banner[1].url" alt="">
                                    </div>
                                    <div class="col-md-3" style="padding-left: 0;">
                                        <img [src]="environment.api_img + slider.banner[2].url" alt="">
                                    </div>
                                    <div class="col-md-3" style="padding-left: 0;">
                                        <img [src]="environment.api_img + slider.banner[3].url" alt="">
                                    </div>
                                </div>

                                <h1 class="container mb-4 text-left"
                                    style="color: rgb(0, 0, 0) ;text-align: left;margin: 4%; letter-spacing: -2px !important; margin-bottom: 1% !important;"
                                    [innerHTML]="slider?.Title"></h1>

                                <p class="container md:text-subtitle text-sm font-medium white-text" style="color: rgb(0, 0, 0) !important;text-align: left;
                                    font-size: 25px;
                                    line-height: 33px;
                                    letter-spacing: 0px !important;
                                    margin: 4%; margin-top: 1% !important;"
                                    [innerHTML]="slider.description[0].children[0].text"></p>

                                <div class="container flex-container">
                                    <button (click)="onClick('contact')"
                                        class="btn btn-primary view-work custom-button">
                                        Cotiza Aquí
                                    </button>
                                </div>

                                <!-- Segunda fila de imágenes - Solo visible en desktop/tablet -->
                                <div class="container row d-none d-md-flex" style="margin-left: 4%;margin-top: 2%;">
                                    <div class="col-md-3" style="padding-left: 0;">
                                        <img [src]="environment.api_img + slider.banner[4].url" alt="">
                                    </div>
                                    <div class="col-md-3" style="padding-left: 0;">
                                        <img [src]="environment.api_img + slider.banner[5].url" alt="">
                                    </div>
                                    <div class="col-md-3" style="padding-left: 0;">
                                        <img [src]="environment.api_img + slider.banner[6].url" alt="">
                                    </div>
                                    <div class="col-md-3" style="padding-left: 0;">
                                        <img [src]="environment.api_img + slider.banner[7].url" alt="">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>
    </owl-carousel-o>
</div>
