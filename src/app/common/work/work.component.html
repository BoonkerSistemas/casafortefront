<div id="work" class="work-area pt-100">
    <div class="container">
        <div class="section-title-casa">
            <h2 style="letter-spacing: 0">{{ title }}</h2>
            <p>{{ description }}</p>
        </div>
    </div>

    <div class="container">
        <div class="work-tabs">
            <!-- Pestañas principales -->
            <ul class="nav-tabset">
                <ng-container *ngFor="let tab of tabs">
                    <li class="nav-tab" *ngIf="tab.number !== 'null'"
                        [ngClass]="{ 'active': currentTab === tab.number }">
                        <span (click)="switchTab(tab.number)">
                            {{ tab.title }}
                        </span>
                    </li>
                </ng-container>

            </ul>

            <div class="tabs-container">
                <div *ngIf="filteredWorks.length > 0">
                    <div class="pane">
                        <div class="row" style="justify-content: center;">
                            <!-- Imágenes de los trabajos -->
                            <div class="col-lg-3" *ngFor="let workItem of filteredWorks">
                                <div class="single-work" [ngStyle]="{'--background-color': workItem.color}">
                                    <img [src]="workItem.img" alt="work-img" class="work-img"
                                        [ngClass]="{ 'active': workItem.img === workSelected.img }">
                                </div>
                            </div>

                            <!-- Sección de categorías de la imagen seleccionada -->
                            <div class="col-lg-12" *ngIf="workSelected">
                                <div class="work-content">
                                    <ul class="nav-tabset-categorias" *ngIf="workSelected.categorias?.length">
                                        <li *ngFor="let categoria of workSelected.categorias" class="nav-tab-categorias"
                                            [ngClass]="{ 'active': currentTab2 === categoria.id }">
                                            <span (mouseenter)="switchTab2(categoria)">
                                                <img class="imgCategorias"
                                                    [src]="environment.api_img + (categoria.icon?.url || 'images/Maestra.png')"
                                                    alt="categoria-img">
                                                <p
                                                    style="margin-top:10px;letter-spacing: 0; font-size: 14px;display: flex;justify-content: space-evenly;">
                                                    <span style=" width: 20px;
                                                    height: 20px;
                                                    margin-right: 8px;
                                                    border: 1px solid #ddd;"
                                                        [style.background-color]="workSelected.color"></span>
                                                    {{categoria.title }}
                                                </p>
                                            </span>
                                        </li>
                                    </ul>

                                    <!-- Contenido de la categoría seleccionada -->
                                    <div *ngIf="currentTab2 && workSelected"
                                        style=" padding-bottom: 32px; color: #6f6f6e; font-size: 15px; ">
                                        {{ getCategoriaContent() }}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mensaje si no hay trabajos en la pestaña seleccionada -->
                <p *ngIf="filteredWorks.length === 0">No hay trabajos disponibles para esta categoría.</p>
            </div>
        </div>
    </div>
</div>
